<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lợi ích của công nghệ số trong học tập</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .infographic-img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Tỷ lệ khung hình 16:9 */
            height: 0;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lợi ích của công nghệ số trong học tập</h1>
        
        <!-- Hiển thị ảnh infographic -->
        <!-- Lưu ý: Thay thế 'path/to/Lab05_Ex2.1_2.png' bằng đường dẫn thực tế hoặc tên file ảnh của bạn -->
        <img src="Lab05_Ex2.1_2.png" alt="Infographic Lợi ích của công nghệ số trong học tập" class="infographic-img">

        <h2>Video giới thiệu</h2>
        
        <!-- Nhúng video Youtube có thể phát trực tiếp -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/jZYnm0itqk0" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
